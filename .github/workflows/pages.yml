# GitHub Pages serves one source, so this publishes both versions together:
# main at the site root and the presentation branch at /presentation/.
name: Publish site
on:
  push:
    branches: [main, presentation]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: presentation
          path: presentation
      - run: |
          mkdir -p _site/presentation
          cp -r main/index.html main/credits.html main/images _site/
          cp -r presentation/index.html presentation/credits.html presentation/images _site/presentation/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
